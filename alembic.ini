[alembic]
script_location = src/procureai/infrastructure/database/migrations
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is taken from DATABASE_URL (see env.py)

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
