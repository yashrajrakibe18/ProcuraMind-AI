name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: PYTHONPATH=src python scripts/evaluate_retrieval.py --k 3
      - name: Migrations match models
        run: |
          export DATABASE_URL=sqlite:///./ci.db
          alembic upgrade head && alembic check
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t procureai-api .
      - run: docker build -f docker/web.Dockerfile -t procureai-web .
