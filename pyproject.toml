[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procureai"
version = "1.0.0"
description = "ProcureAI - Agentic AI-based procurement intelligence and decision support"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "pytesseract>=0.3.10",
  "pillow>=10",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "chromadb>=0.5",
  "langgraph>=0.2",
  "reportlab>=4.0",
  "openpyxl>=3.1",
  "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
web = ["streamlit>=1.37", "plotly>=5.22", "requests>=2.32"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "apps/api", "apps/web"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "apps/api", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP042", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
