# Local development stack: PostgreSQL + API + Streamlit UI. Data lives in named volumes.
# Copy .env.example to .env and set SECRET_KEY / POSTGRES_PASSWORD before first start.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: procureai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procureai-dev-only}
      POSTGRES_DB: procureai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureai"]
      interval: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://procureai:${POSTGRES_PASSWORD:-procureai-dev-only}@db:5432/procureai
      VECTOR_STORE_PATH: /app/storage/chroma
      DOCUMENT_STORAGE_PATH: /app/storage/documents
      AUTO_CREATE_TABLES: "false"          # schema is managed by Alembic (run on container start)
      CORS_ALLOWED_ORIGINS: http://localhost:8501
    depends_on: { db: { condition: service_healthy } }
    volumes: [appdata:/app/storage]
    ports: ["8000:8000"]
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    environment:
      API_BASE_URL: http://api:8000/api/v1
    depends_on: { api: { condition: service_healthy } }
    ports: ["8501:8501"]
volumes:
  pgdata:
  appdata:
